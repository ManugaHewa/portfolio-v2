# Nginx site for https://manugahewa.dev
#
# The version-controlled copy of /etc/nginx/sites-available/portfolio.
# A push does NOT deploy this file. Copy it into place by hand, run
# `sudo nginx -t`, then reload: docs/manual-steps.md has the exact commands.
#
# Path of a request: Cloudflare -> cloudflared (the tunnel, on this machine)
# -> this server on port 80 -> a file from /var/www/portfolio, or /api/ to
# Express on 127.0.0.1:4000.

# The access log keeps the network but not the visitor: the last part of
# every address is zeroed (192.0.2.33 is logged as 192.0.2.0). Enough to spot
# abuse from one network, not a record of who read the site. The privacy page
# says so, so keep the two in step.
map $remote_addr $portfolio_anon_addr {
    ~^(?<ipv4_net>\d+\.\d+\.\d+)\.\d+$            $ipv4_net.0;
    ~^(?<ipv6_net>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*)  $ipv6_net::;
    default                                       0.0.0.0;
}

# The path as requested, without its query string. $uri would log a 404 as
# "/404.html" (where it was internally redirected), and the full request URI
# would keep whatever tracking parameters arrived with it.
map $request_uri $portfolio_request_path {
    ~^(?<path_only>[^?]*)  $path_only;
}

log_format portfolio_privacy '$portfolio_anon_addr [$time_local] '
                             '"$request_method $portfolio_request_path $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    # localhost: deploy.sh checks the site through Nginx with curl.
    server_name manugahewa.dev www.manugahewa.dev localhost 127.0.0.1;

    root /var/www/portfolio;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/access.log portfolio_privacy;

    # The visitor's real address. cloudflared connects from this machine, so
    # only a loopback peer may name the client through CF-Connecting-IP.
    # Anything reaching port 80 directly from the LAN keeps its own address,
    # whatever headers it sends.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/plain application/xml;

    # ------------------------------------------------------------------
    # Security headers for everything served from disk. ("always" adds them
    # to 404s and other errors too.)
    #
    # The CSP allows only this origin. Scripts: no inline code and no eval,
    # which the build does not need. Styles: 'unsafe-inline' because the
    # prerendered HTML carries inline style attributes (the animation
    # library's starting states); style injection cannot run code.
    # img-src data: is the inline SVG favicon.
    #
    # Things this policy blocks on purpose:
    #   - Cloudflare Web Analytics (static.cloudflareinsights.com), if it is
    #     still switched on in the dashboard. To keep it instead, add that
    #     host to script-src.
    #   - Cloudflare Turnstile, which is off. To switch it on, add
    #     https://challenges.cloudflare.com to script-src and frame-src.
    #
    # Shipped as Report-Only. Watch the browser console for "[Report Only]"
    # messages, then rename the header to Content-Security-Policy.
    # ------------------------------------------------------------------
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # frame-ancestors above covers modern browsers once the CSP is enforced;
    # this covers older ones, and the Report-Only period.
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, never appended. After real_ip above, $remote_addr is
        # the visitor, so whatever a client put in its own X-Forwarded-For is
        # dropped here. Express trusts exactly this one loopback hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Contact messages are capped at 10 kB by the API; nothing else here
        # takes a body at all.
        client_max_body_size 16k;
        proxy_read_timeout 15s;

        # The API sends its own security headers (Helmet). Declaring any
        # add_header in this block stops the server-level ones above from
        # being inherited here, so API responses do not get two conflicting
        # copies of Referrer-Policy and X-Frame-Options.
        add_header Cache-Control "no-store" always;
    }

    # Hashed build output never changes under the same name, so browsers and
    # Cloudflare can keep it for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Pages and the files beside them (robots.txt, sitemap.xml, og.png):
    # revalidated on every load, so a deploy shows up straight away.
    #
    # A real file, a real page, or a real 404. The site has no client-side
    # routes, so the old fall-back to index.html is gone: it answered every
    # unknown URL with the home page and a 200, which search engines count
    # as duplicate content.
    location / {
        expires -1;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
