name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Note: the server deploys main on its own five-minute cron and does not wait
# for this workflow. A red run here means "fix it", not "it did not ship".

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # ci, not install: the lockfile is what the server's `npm ci` installs.
      - run: npm ci
      - run: npx prisma generate --schema backend/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema backend/prisma/schema.prisma
      - run: npm run lint --workspace backend
      # Tests, admin scripts and the seed: none of them are compiled by the
      # build, and tsx and Vitest do not check types.
      - run: npm run typecheck --workspace backend
      - run: npm run test --workspace backend
      # Vitest strips types without checking them, and the deploy compiles
      # with tsc, so a type error would otherwise first show up as a failed
      # deploy.
      - run: npm run build --workspace backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace frontend
      - run: npm run test --workspace frontend
      - run: npm run build --workspace frontend

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # What ships: the API's runtime dependencies and the browser bundle's.
      # A high or critical advisory here fails the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # Dev tooling too, as a report. The findings left there need major
      # upgrades of vite, vitest and @typescript-eslint (see
      # docs/audit-2026-10.md, appendix D), so gating on them would only
      # train everyone to ignore a red build.
      - name: Audit everything (report only)
        run: npm audit
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit, not just the tip: a secret removed in a later commit
          # is still in the history anyone can clone.
          fetch-depth: 0
      - name: Scan history for secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --verbose --no-banner
