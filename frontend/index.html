    <!-- Structured data: who this page is about. Only facts the page itself
         states. A data block, so the CSP's script-src does not apply. -->

         data-reveal. Without JavaScript nothing moves them on, so show the
         finished state. Only [data-reveal]: the old attribute-sniffing
         selectors also un-hid things that were meant to stay hidden. -->
    <noscript>
      <style>
        [data-reveal] { opacity: 1 !important; transform: none !important; }
